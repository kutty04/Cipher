<!doctype html>
<html lang="en">
  <head>
  <script>
    const originalLog = console.log;
    const originalError = console.error;
    
    async function sendToBackend(type, args) {
      try {
        await fetch('http://localhost:5001/api/debug/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            type, 
            msg: args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ') 
          })
        });
      } catch(e) {}
    }
    
    console.log = (...args) => {
      originalLog(...args);
      sendToBackend('log', args);
    };
    
    console.error = (...args) => {
      originalError(...args);
      sendToBackend('error', args);
    };
    
    window.addEventListener('error', (e) => {
      sendToBackend('uncaught-error', [e.message, e.filename, e.lineno]);
    });
  </script>
